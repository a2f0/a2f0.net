<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>a2f0.net</title>
    <style>
      @property --lens {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }

      @property --x {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }

      @property --y {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }

      :root {
        --mono:
          ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        color-scheme: dark;
        background: #000;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100dvh;
        background: #000;
      }

      main {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        container-type: inline-size;
      }

      /* Both views share one cell. The view not on show sits above the other,
         clipped to a lens that follows the pointer, so it only shows inside
         that circle. */
      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        width: min(100%, 1440px);
        overflow: hidden;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .stage > * {
        grid-area: 1 / 1;
        align-self: center;
        background: #000;
      }

      .graffiti {
        display: block;
        width: 100%;
        height: auto;
      }

      .ascii {
        margin: 0;
        color: #5c5c5c;
        font-family: var(--mono);
        font-size: calc(min(100cqw, 1440px) / var(--columns) / var(--ratio));
        font-variant-ligatures: none;
        line-height: 1;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      .ascii .side {
        color: #8c8c8c;
      }

      .ascii .face {
        color: #f2f2f2;
      }

      .stage[data-view="svg"] > .ascii,
      .stage[data-view="ascii"] > .graffiti {
        --lens: inherit;
        --x: inherit;
        --y: inherit;
        z-index: 1;
        clip-path: circle(var(--lens) at var(--x) var(--y));
      }

      .view-toggle {
        position: fixed;
        right: 16px;
        bottom: 16px;
        padding: 6px 10px;
        border: 1px solid #333;
        border-radius: 4px;
        background: #0a0a0a;
        color: #8a8a8a;
        font: 12px/1 var(--mono);
        letter-spacing: 0.08em;
        cursor: pointer;
      }

      .view-toggle:hover,
      .view-toggle:focus-visible,
      .view-toggle[aria-pressed="true"] {
        border-color: #666;
        color: #eee;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stage" data-view="svg">
        <img
          class="graffiti"
          src="/a2f0.svg"
          alt="a2f0 in sculpted, grayscale graffiti lettering"
          width="1300"
          height="525"
          draggable="false"
        />
        <pre
          class="ascii"
          role="img"
          aria-label="a2f0 graffiti rendered as ASCII art"
          aria-hidden="true"
        ></pre>
      </div>
    </main>
    <button class="view-toggle" type="button" aria-pressed="false" hidden>
      ascii
    </button>
    <script type="module" src="/ascii.js"></script>
  </body>
</html>
