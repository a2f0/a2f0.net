<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>a2f0.net</title>
    <style>
      @property --lens {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }

      @property --x {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }

      @property --y {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }

      :root {
        --mono:
          ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        color-scheme: dark;
        background: #000;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100dvh;
        background: #000;
      }

      main {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        container-type: inline-size;
      }

      /* The canvas holds the artwork and the toolbar in its top-right corner.
         The toolbar sits outside the stage so its clicks never flip the view. */
      .canvas {
        position: relative;
        width: min(100%, 1440px);
      }

      /* Both views share one cell. The view not on show sits above the other,
         clipped to a lens that follows the pointer, so it only shows inside
         that circle. */
      .stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        overflow: hidden;
        isolation: isolate;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .stage > * {
        grid-area: 1 / 1;
        align-self: center;
        background: #000;
      }

      .graffiti {
        display: block;
        width: 100%;
        height: auto;
      }

      .ascii {
        margin: 0;
        color: #5c5c5c;
        font-family: var(--mono);
        font-size: calc(min(100cqw, 1440px) / var(--columns) / var(--ratio));
        font-variant-ligatures: none;
        line-height: 1;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      .ascii .side {
        color: #8c8c8c;
      }

      .ascii .face {
        color: #f2f2f2;
      }

      .stage[data-view="svg"] > .ascii,
      .stage[data-view="ascii"] > .graffiti {
        --lens: inherit;
        --x: inherit;
        --y: inherit;
        z-index: 1;
        clip-path: circle(var(--lens) at var(--x) var(--y));
      }

      .toolbar {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 6px;
      }

      .tool {
        display: grid;
        width: 28px;
        height: 28px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 4px;
        background: #0a0a0a;
        color: #8a8a8a;
        cursor: pointer;
      }

      .tool[hidden] {
        display: none;
      }

      .tool svg {
        width: 16px;
        height: 16px;
      }

      /* Tools read like links: white on hover, with no pressed look. */
      .tool:hover,
      .tool:focus-visible {
        color: #fff;
      }

      .tool[aria-disabled="true"] {
        color: #8a8a8a;
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="canvas">
        <div class="stage" data-view="svg">
          <img
            class="graffiti"
            src="/a2f0.svg"
            alt="a2f0 in sculpted, grayscale graffiti lettering"
            width="1300"
            height="525"
            draggable="false"
          />
          <pre
            class="ascii"
            role="img"
            aria-label="a2f0 graffiti rendered as ASCII art"
            aria-hidden="true"
          ></pre>
        </div>
        <div class="toolbar">
          <button
            class="tool music-toggle"
            type="button"
            aria-label="Music player"
            aria-disabled="true"
            title="Music player (coming soon)"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M6 12V4l8-1.5v8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
              <ellipse
                cx="4"
                cy="12"
                rx="2.2"
                ry="1.7"
                transform="rotate(-20 4 12)"
                fill="currentColor"
              />
              <ellipse
                cx="12"
                cy="10.5"
                rx="2.2"
                ry="1.7"
                transform="rotate(-20 12 10.5)"
                fill="currentColor"
              />
            </svg>
          </button>
          <button
            class="tool view-toggle"
            type="button"
            aria-label="ASCII view"
            aria-pressed="false"
            title="ASCII view"
            hidden
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M6.5 2.5 5 13.5M11 2.5l-1.5 11M2.5 6h11M2.5 10h11"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="/ascii.js"></script>
  </body>
</html>
