<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>a2f0.net</title>
    <style>
      :root {
        color-scheme: dark;
        background: #000;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100dvh;
        background: #000;
      }

      main {
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
      }

      .graffiti {
        display: block;
        width: min(100%, 1440px);
        height: auto;
        user-select: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        class="graffiti"
        src="/a2f0.svg"
        alt="a2f0 in sculpted, grayscale graffiti lettering"
        width="1300"
        height="525"
        draggable="false"
      />
    </main>
  </body>
</html>
