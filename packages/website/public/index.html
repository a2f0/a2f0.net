<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>a2f0.net</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <style>
      @property --lens {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }

      @property --x {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }

      @property --y {
        syntax: "<length>";
        inherits: false;
        initial-value: 0px;
      }

      :root {
        --mono:
          ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        color-scheme: dark;
        background: #000;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100dvh;
        background: #000;
      }

      main {
        position: relative;
        display: grid;
        min-height: 100dvh;
        place-items: center;
        overflow: hidden;
        container-type: inline-size;
      }

      /* The canvas holds the artwork and the toolbar in its top-right corner.
         The toolbar sits outside the stage so its clicks never flip the view. */
      .canvas {
        --bar: 32px;
        position: relative;
        width: min(100%, 1440px);
      }

      /* The open window's bars sit above and below the art. They are the
         same height, so the art stays centred where it was. A viewport too
         short for the art and both bars scrolls instead, moving the art to
         make room. The room is taken only while the window is open:
         reserving it when closed would leave that page scrolling, with the
         art off-centre, for everyone who never opens the window. */
      .canvas[data-window] {
        margin-block: var(--bar);
      }

      /* Both views share one cell. The view not on show sits above the other,
         clipped to a lens that follows the pointer, so it only shows inside
         that circle. */
      .stage {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        overflow: hidden;
        isolation: isolate;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      .stage > * {
        grid-area: 1 / 1;
        align-self: center;
        background: #000;
      }

      .graffiti {
        display: block;
        width: 100%;
        height: auto;
      }

      /* The script opens on the ASCII, so the SVG waits hidden while that
         renders rather than showing first. It shows anyway after a few
         seconds, in case the script never runs. */
      @media (scripting: enabled) {
        .stage:not([data-ready]) > .graffiti {
          animation: placeholder 3s;
        }
      }

      @keyframes placeholder {
        from,
        to {
          visibility: hidden;
        }
      }

      .ascii {
        margin: 0;
        color: #5c5c5c;
        font-family: var(--mono);
        font-size: calc(min(100cqw, 1440px) / var(--columns) / var(--ratio));
        font-variant-ligatures: none;
        line-height: 1;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      .ascii .side {
        color: #8c8c8c;
      }

      .ascii .face {
        color: #f2f2f2;
      }

      .stage[data-view="svg"] > .ascii,
      .stage[data-view="ascii"] > .graffiti {
        --lens: inherit;
        --x: inherit;
        --y: inherit;
        z-index: 1;
        clip-path: circle(var(--lens) at var(--x) var(--y));
      }

      /* The etching plays over the SVG and the code rain over the ASCII, and
         clicks pass through both. */
      .stage[data-etching],
      .stage[data-raining] {
        cursor: default;
      }

      /* The rain fills the page, writing the ASCII as it falls past. The
         toolbar, the window, and its outlines stay above it. */
      .rain {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 0 2px rgb(255 255 255 / 0.6));
        pointer-events: none;
      }

      .stage > .etch-fills {
        z-index: 2;
        width: 100%;
        height: auto;
        background: none;
        pointer-events: none;
      }

      .stage > .etch-lines {
        z-index: 3;
        width: 100%;
        height: auto;
        background: none;
        filter: drop-shadow(0 0 3px rgb(255 255 255 / 0.7));
        pointer-events: none;
      }

      /* Every stroke is etched as a thin line whatever its width in the
         art, white while hot and gray once it cools. */
      .etch-lines * {
        fill: none;
      }

      .etch-lines .etch-stroke {
        stroke: #fff;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition:
          stroke 1.2s ease-out,
          opacity 0.4s ease-out;
      }

      .etch-lines .etch-stroke.cooled {
        stroke: #8c8c8c;
      }

      .etch-lines .etch-stroke.filled {
        opacity: 0;
      }

      .stage > .etch-glow {
        position: absolute;
        z-index: 4;
        inset: 0;
        width: 100%;
        height: 100%;
        background: none;
        pointer-events: none;
      }

      /* A terminal window around the art: a title bar above it and a prompt
         below. Clicks pass through to the art. */
      .window {
        display: none;
        position: absolute;
        z-index: 1;
        inset: calc(-1 * var(--bar)) 0;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
        border: 1px solid #3d3d3d;
        border-radius: 8px;
        pointer-events: none;
      }

      .canvas[data-window] > .window {
        display: flex;
      }

      /* Each bar fills the room beside the art, inside the window's border. */
      .titlebar,
      .prompt {
        display: flex;
        box-sizing: border-box;
        height: calc(var(--bar) - 1px);
        align-items: center;
      }

      .titlebar {
        position: relative;
        justify-content: center;
        border-bottom: 1px solid #2a2a2a;
        background: #141414;
        color: #8a8a8a;
        font: 12px system-ui, sans-serif;
      }

      .lights {
        position: absolute;
        left: 12px;
        display: flex;
        gap: 8px;
      }

      .lights > span {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #4d4d4d;
      }

      .prompt {
        gap: 0.5ch;
        padding-inline: 12px;
        background: #000;
        color: #8c8c8c;
        font: 13px var(--mono);
      }

      .cursor {
        width: 1ch;
        height: 1.2em;
        background: #f2f2f2;
        animation: blink 1.06s steps(1) infinite;
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .cursor {
          animation: none;
        }
      }

      /* Outlines that zoom between the toolbar's square and the window. */
      .zoom-line {
        position: absolute;
        z-index: 1;
        box-sizing: border-box;
        border: 1px solid #fff;
        border-radius: 4px;
        box-shadow: 0 0 4px rgb(255 255 255 / 0.4);
        pointer-events: none;
      }

      .toolbar {
        position: absolute;
        z-index: 1;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 6px;
      }

      .tool {
        display: grid;
        width: 28px;
        height: 28px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 4px;
        background: #0a0a0a;
        color: #8a8a8a;
        cursor: pointer;
      }

      .tool[hidden] {
        display: none;
      }

      .tool svg {
        width: 16px;
        height: 16px;
      }

      .play-toggle .icon-stop,
      .play-toggle[data-playing] .icon-play {
        display: none;
      }

      .play-toggle[data-playing] .icon-stop {
        display: block;
      }

      /* Tools read like links: white on hover, with no pressed look. */
      .tool:hover,
      .tool:focus-visible {
        color: #fff;
      }

      .tool[aria-disabled="true"] {
        color: #8a8a8a;
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="visually-hidden">a2f0</h1>
      <div class="canvas">
        <div class="stage" data-view="svg">
          <img
            class="graffiti"
            src="/a2f0.svg"
            alt="a2f0 in sculpted, grayscale graffiti lettering"
            width="1300"
            height="525"
            draggable="false"
          />
          <pre
            class="ascii"
            role="img"
            aria-label="a2f0 graffiti rendered as ASCII art"
            aria-hidden="true"
          ></pre>
        </div>
        <div class="window" aria-hidden="true">
          <div class="titlebar">
            <span class="lights"><span></span><span></span><span></span></span>
            <span class="title">a2f0 — zsh</span>
          </div>
          <div class="prompt">
            <span>a2f0@a2f0.net ~ %</span><span class="cursor"></span>
          </div>
        </div>
        <div class="toolbar">
          <button
            class="tool play-toggle"
            type="button"
            aria-label="Play code rain animation"
            title="Play code rain animation"
            hidden
          >
            <svg
              class="icon-play"
              viewBox="0 0 16 16"
              aria-hidden="true"
              focusable="false"
            >
              <path d="M5 3.2v9.6l7.6-4.8z" fill="currentColor" />
            </svg>
            <svg
              class="icon-stop"
              viewBox="0 0 16 16"
              aria-hidden="true"
              focusable="false"
            >
              <rect x="4" y="4" width="8" height="8" rx="1" fill="currentColor" />
            </svg>
          </button>
          <button
            class="tool music-toggle"
            type="button"
            aria-label="Music player"
            aria-disabled="true"
            title="Music player (coming soon)"
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M6 12V4l8-1.5v8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
              <ellipse
                cx="4"
                cy="12"
                rx="2.2"
                ry="1.7"
                transform="rotate(-20 4 12)"
                fill="currentColor"
              />
              <ellipse
                cx="12"
                cy="10.5"
                rx="2.2"
                ry="1.7"
                transform="rotate(-20 12 10.5)"
                fill="currentColor"
              />
            </svg>
          </button>
          <button
            class="tool view-toggle"
            type="button"
            aria-label="ASCII view"
            aria-pressed="true"
            title="ASCII view"
            hidden
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path
                d="M6.5 2.5 5 13.5M11 2.5l-1.5 11M2.5 6h11M2.5 10h11"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
          <button
            class="tool window-toggle"
            type="button"
            aria-label="Terminal window"
            aria-pressed="false"
            title="Terminal window"
            hidden
          >
            <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect
                x="2.75"
                y="2.75"
                width="10.5"
                height="10.5"
                rx="1"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
            </svg>
          </button>
        </div>
      </div>
    </main>
    <script type="module" src="/graffiti.js"></script>
  </body>
</html>
