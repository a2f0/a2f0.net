<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <title>Grayscale gradient favicon</title>
  <style>
    .background { fill: #202020; }
    @media (prefers-color-scheme: light) {
      .background { fill: #f4f4f4; }
    }
  </style>
  <defs>
    <linearGradient id="grayscale" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#000000" />
      <stop offset="1" stop-color="#eeeeee" />
    </linearGradient>
  </defs>
  <rect class="background" width="16" height="16" fill="#202020" />
  <rect x="1" y="1" width="14" height="14" fill="url(#grayscale)" />
</svg>
