---
# yamllint disable rule:line-length
name: CI
# yamllint disable-line rule:truthy
on:
  push:
    branches: "**"
  pull_request:
  workflow_dispatch:
    inputs:
      preview:
        description: Run all guarded live previews after validation (no deploy)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    # Keep this stable: the main ruleset requires the "build" context.
    name: build
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v5.2.2
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.17
          install_args: bun node
      - name: Verify runtime pins before building
        run: |
          test "bun@$(bun --version)" = "$(bun -p 'require("./package.json").packageManager')"
          test "$(bun --version)" = "$(bun -p 'Bun.TOML.parse(await Bun.file(".mise.toml").text()).tools.bun')"
          test "$(node --version)" = "$(cat .nvmrc)"
          test "=$(node -p process.versions.node)" = "$(bun -p 'require("./package.json").engines.node')"
      - run: bun ci
      - name: Verify installed agent CLI
        run: |
          bun run agent-tool --version
          bun run agent-tool config show
          bun run agents:check
      - name: Check the actual branch name
        if: github.event_name == 'pull_request' || github.ref_type == 'branch'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: bun run lint:branch-name "$BRANCH_NAME"
      - run: bun audit --audit-level=critical
      # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.15"
      - run: pip install yamllint==1.38.0
      # v4.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: "1.17.0"
      # v6.3.2
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337
        with:
          tflint_version: v0.64.0
      - name: Validate Terraform without backend credentials
        run: |
          terraform -chdir=terraform init -backend=false -lockfile=readonly
          terraform -chdir=terraform validate
          terraform fmt -check -recursive terraform
      - run: bun run lint:md
      - run: sh ./scripts/git/hooks/pre-commit
      - run: sh ./scripts/git/hooks/pre-push </dev/null
      - run: bun run compile
      - run: bun run unit
      - name: Test exported site with Cloudflare Workers
        run: bun run ci-headless
      - name: Test the staging resume export's search rules with Cloudflare Workers
        run: bun run ci-headless:staging
      - name: Test apex website with Cloudflare Workers
        run: bun run --cwd packages/website test
      - name: Test demo with Cloudflare Workers
        run: bun run --cwd packages/demo test
      - name: Test drive with Cloudflare Workers
        run: bun run --cwd packages/drive test

  preview:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.preview
    runs-on: ubuntu-latest
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v5.2.2
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.17
          install_args: bun node
      - run: bun ci
      - run: bun run build
        env:
          RESUME_DEPLOY_TIER: production
      - name: Preview the exact assets and existing Worker identity
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for target in resume-prod website demo drive; do
            bun scripts/deploy/deploy.ts "$target" --dry-run
          done
      # The staging resume is its own build: it keeps every response out of
      # search results, and the guard refuses either tier's export for the other.
      - name: Build the staging resume
        run: bun run build --filter=@resume/site
        env:
          RESUME_DEPLOY_TIER: staging
      - name: Preview the staging resume
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun scripts/deploy/deploy.ts resume-staging --dry-run

  deploy:
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # v5.2.2
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          version: 2026.10.17
          install_args: bun node
      - run: bun ci
      - name: Build resume
        if: github.ref == 'refs/heads/staging'
        run: bun run build --filter=@resume/site
        env:
          RESUME_DEPLOY_TIER: staging
      - name: Build all workspaces
        if: github.ref == 'refs/heads/main'
        run: bun run build
        env:
          RESUME_DEPLOY_TIER: production
      - name: Deploy staging
        if: github.ref == 'refs/heads/staging'
        working-directory: packages/resume
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun ../../scripts/deploy/deploy.ts resume-staging
      - name: Deploy production
        if: github.ref == 'refs/heads/main'
        working-directory: packages/resume
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun ../../scripts/deploy/deploy.ts resume-prod
      - name: Deploy website
        if: github.ref == 'refs/heads/main'
        working-directory: packages/website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun ../../scripts/deploy/deploy.ts website
      - name: Deploy demo
        if: github.ref == 'refs/heads/main'
        working-directory: packages/demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun ../../scripts/deploy/deploy.ts demo
      - name: Deploy drive
        if: github.ref == 'refs/heads/main'
        working-directory: packages/drive
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bun ../../scripts/deploy/deploy.ts drive
