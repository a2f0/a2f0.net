---
name: CI
# yamllint disable-line rule:truthy
on:
  push:
    branches: '**'
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - run: pnpm audit --audit-level=critical
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: pnpm install
      - uses: actions/setup-python@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
      - uses: terraform-linters/setup-tflint@v6
        name: Setup TFLint
        with:
          tflint_version: v0.55.0
      - run: sh ./.husky/pre-commit
      - run: npm run unit
      - run: npm run ci-headless
        env:
          CHROME_VERSION: ${{ matrix.chrome-version }}
      # production deploy
      - uses: amondnet/vercel-action@v25
        # yamllint disable-line rule:line-length
        if: ${{ github.event.ref == 'refs/heads/production' && github.event_name == 'push' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-args: '--prod'
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      # staging-deploy
      - uses: amondnet/vercel-action@v25
        # yamllint disable-line rule:line-length
        if: ${{ github.event.ref == 'refs/heads/staging' && github.event_name == 'push' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          alias-domains: ${{ secrets.STAGING_DOMAIN }}
      - name: Post to slack
        uses: 8398a7/action-slack@v3
        if: ${{ failure() }}
        with:
          status: ${{ job.status }}
          # yamllint disable-line rule:line-length
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
