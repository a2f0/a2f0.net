repos:
  - repo: 'https://github.com/pre-commit/pre-commit-hooks'
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: 'https://github.com/gruntwork-io/pre-commit'
    rev: v0.1.23
    hooks:
      - id: terraform-fmt
      - id: tflint
      - id: shellcheck
  - repo: local
    hooks:
      - id: biome
        name: biome
        entry: pnpm biome lint
        pass_filenames: false
        language: node
      - id: ajv
        name: ajv
        entry: lib/scripts/ajv.ts
        pass_filenames: false
        language: node
