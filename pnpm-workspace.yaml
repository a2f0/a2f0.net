---
packages:
  - packages/*

saveExact: true

# Patched releases beyond the ranges used by the browser-test and lint tooling.
overrides:
  basic-ftp: 5.3.1
  serialize-javascript: 7.1.1
  smol-toml: 1.8.0

allowBuilds:
  "@ffmpeg-installer/darwin-arm64": true
  "@ffmpeg-installer/darwin-x64": true
  "@ffmpeg-installer/linux-arm64": true
  "@ffmpeg-installer/linux-x64": true
  "@ffmpeg-installer/win32-x64": true
  core-js: false
  canvas: true
  esbuild: true
  sharp: true
  workerd: true
  edgedriver: false
  geckodriver: false

minimumReleaseAgeExclude:
  - miniflare@5.20260915.0-alpha
  - wrangler@4.132.0
